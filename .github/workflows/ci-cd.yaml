name: School-portal
on:
  push:
    branches:
      - main
      - staging
      - production
permissions:
  contents: read
  security-events: write
  attestations: write
  id-token: write

jobs:
  build:
    name: Build stage
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        services:
          - auth-service
          - class-service
    steps:
      - name: checkout code
        uses: action/checkout@v4

      - name: setup python
        uses: action/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/${{matrix.service}}/requirements.txt

      - name: dependency instalation
        run: |
          "python -m pip install --upgrade pip
           if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
           fi
           pip install pytest pytest-mock 
          "
        
      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: services/${{ matrix.services }}
          exit-code: 1 
          severity: CRITICAL,HIGH

      - name: Unit test
        run: |
          pytest tests/unit

      - name: Integration test
        run: |
          pytest tests/integration
      
      - name: Setup QEMU (Multi-architecture support)
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.services }}
          file: services/${{ matrix.services }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.services }}:${{ github.sha }}

      - name: Container Image Scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.services }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.services }}:${{ github.sha }}
          output-format: spdx-json

      - name: Install Cosign Engine
        uses: sigstore/cosign-installer@v3

      - name: Cryptographically Sign Image (Keyless)
        run: |
          cosign sign --yes ${{ secrets.DOCKER_USERNAME }}/${{ matrix.services }}:${{ github.sha }}

      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.services }}
          subject-digest: ${{ steps.docker-build.outputs.digest }}
          push-to-registry: true

  deploy-dev:
    name: Deploy Microservices to AWS EKS
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.ref_name }} 
    strategy:
      fail-fast: false
      matrix:
        services:
          - auth-service
          - class-service
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }} 

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.AWS_CLUSTER_NAME }}

      - name: Update Kubernetes Container Image Tag
        run: |
          kubectl set image deployment/${{ matrix.services }} sch-pod01=${{ secrets.DOCKER_USERNAME }}/${{ matrix.services }}:${{ github.sha }} --record
        
      - name: Verify Rolling Update Rollout Status
        run: |
          kubectl rollout status deployment/${{ matrix.services }} --timeout=5m