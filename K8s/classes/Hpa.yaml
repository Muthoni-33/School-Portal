apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: class-micro-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: class-micro

  minReplicas: 4
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: utilization
          averageUtilization: 85